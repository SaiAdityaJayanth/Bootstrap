<!DOCTYPE html>
<html>
    <body>
        <p>Finding The Largest Number With help of Argument objects </p>
        <p id="result"></p>
        <script>
            function findMax() {
                var i;
                 var Max = 0
                 for (i = 0; i < arguments.length; i++) {
                    if (arguments[i] > Max) {
                        max = arguments[i];
                    }
                 }
                 return max;
            }
            document.getElementById("result").innerHTML = findMax(4 , 5 , 6 );

        </script>
        </body>
        </html>
