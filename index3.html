<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap example</title>
    <meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


<script src=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
</head>
<body>
    <div class="Container">
        <h2>Basic Progress Bar</h2>
        <p>To Create a default progress bar, use the .progress class to a container element
            and add the progress-bar class to its child element use the css width property to set the width
            of the Progress bar 
        </p>
        <div class="Progress">
            <div class="progress-bar" style="width:70%">70%</div>

        </div>
    </div>
</body>
</html>
