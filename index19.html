<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Objects and Its Properties</h2>

        <p>
            There are two different ways to access an object's property
        </p>
        <p>You can use .property or ["Property"].</p>
        <p id ="demo"></p>
        <script>
            // Create an Object:
            var person = {
                firstname: "I" ,
                age: 20,
            };
            // Display some data from the Object:
            document.getElementById("demo").innerHTML =person.firstname + " am " +
            person.age + "years old ";
        </script>
    </body>
</html>
